<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring UKS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 35%, #fbcfe8 70%, #f472b6 100%);
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 50px -10px rgba(219, 39, 119, 0.15), inset 0 1px 2px 0 rgba(255, 255, 255, 0.9);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(244, 114, 182, 0.35);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #db2777;
            box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.15);
            outline: none;
        }

        .liquid-btn-primary {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.9) 0%, rgba(190, 24, 93, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            box-shadow: 0 8px 25px -5px rgba(190, 24, 93, 0.4);
            transition: all 0.2s ease;
        }

        .liquid-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -5px rgba(190, 24, 93, 0.5);
        }

        .liquid-btn-primary:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="font-sans min-h-screen text-slate-800 antialiased selection:bg-pink-400 selection:text-white flex items-center justify-center p-4">

    <!-- Ambient Glowing Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-pink-400/40 rounded-full blur-[130px] pointer-events-none animate-pulse"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-rose-400/30 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- Main Dynamic Container -->
    <div id="app" class="w-full max-w-md relative z-10">
        <!-- Render Auth Form / Dashboard via JavaScript -->
    </div>

    <!-- Modul JavaScript External -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <!-- Inline Fallback Controller untuk Menjamin Tombol Berfungsi di Vercel -->
    <script>
        // Pengecekan Login saat Halaman Dimuat
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthAndRender();
        });

        function checkAuthAndRender() {
            const currentUser = localStorage.getItem('uks_user');
            const app = document.getElementById('app');

            if (!currentUser) {
                renderLoginForm();
            } else {
                // Jika sudah login, redirect / render app utama
                if (typeof renderDashboardApp === 'function') {
                    renderDashboardApp();
                } else {
                    renderLoginForm();
                }
            }
        }

        function renderLoginForm() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="glass-card p-8 rounded-3xl text-center space-y-6">
                    <div class="flex justify-center">
                        <div class="w-16 h-16 bg-gradient-to-tr from-pink-500 to-rose-600 rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg shadow-pink-500/30">
                            <i class="fa-solid fa-heart-pulse"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black text-slate-800">UKS <span class="text-pink-600">Plus</span></h1>
                        <p class="text-xs font-bold text-pink-600/80 uppercase tracking-wider mt-1">Sistem Monitoring UKS</p>
                        <p class="text-xs text-slate-500 mt-1 italic">Sehat Bersama, Prestasi Juara</p>
                    </div>

                    <h2 class="text-lg font-bold text-slate-700 pt-2">Masuk ke Akun Anda</h2>

                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-left">
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-1">Username</label>
                            <input type="text" id="login-username" required placeholder="Masukkan username" class="glass-input w-full px-4 py-3 rounded-xl text-sm text-slate-800 font-medium placeholder:text-slate-400">
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                            <input type="password" id="login-password" required placeholder="••••••••" class="glass-input w-full px-4 py-3 rounded-xl text-sm text-slate-800 font-medium placeholder:text-slate-400">
                        </div>
                        <button type="submit" class="liquid-btn-primary w-full py-3.5 rounded-xl font-bold text-sm tracking-wide flex items-center justify-center gap-2 mt-2">
                            <span>LOGIN</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>

                    <p class="text-xs font-medium text-slate-600">
                        Belum punya akun? 
                        <button onclick="renderRegisterForm()" class="font-bold text-pink-600 hover:underline">Daftar Akun</button>
                    </p>
                </div>
            `;
        }

        function renderRegisterForm() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="glass-card p-8 rounded-3xl text-center space-y-6">
                    <div>
                        <h1 class="text-2xl font-black text-slate-800">Daftar Akun UKS</h1>
                        <p class="text-xs text-slate-500 mt-1">Lengkapi data untuk membuat akun baru</p>
                    </div>

                    <form onsubmit="handleRegisterSubmit(event)" class="space-y-4 text-left">
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-1">Nama Lengkap</label>
                            <input type="text" id="reg-name" required placeholder="Nama Lengkap" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-1">Username</label>
                            <input type="text" id="reg-username" required placeholder="Username baru" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                            <input type="password" id="reg-password" required placeholder="••••••••" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                        </div>
                        <button type="submit" class="liquid-btn-primary w-full py-3.5 rounded-xl font-bold text-sm tracking-wide flex items-center justify-center gap-2">
                            <span>DAFTAR SEKARANG</span>
                        </button>
                    </form>

                    <p class="text-xs font-medium text-slate-600">
                        Sudah punya akun? 
                        <button onclick="renderLoginForm()" class="font-bold text-pink-600 hover:underline">Login disini</button>
                    </p>
                </div>
            `;
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            localStorage.setItem('uks_user', JSON.stringify({ username: username }));
            alert('Login Berhasil!');
            location.reload(); // Refresh halaman agar masuk ke Dashboard
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            alert('Pendaftaran Berhasil! Silakan Login.');
            renderLoginForm();
        }
    </script>
</body>
</html>
